<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tcar 검토</title>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 400; src: url(/font/Pretendard-Regular.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url(/font/Pretendard-Medium.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url(/font/Pretendard-SemiBold.otf); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url(/font/Pretendard-Bold.otf); }
  /* the TCAR Parser app's palette */
  :root { --bg: #0c0c0e; --side: #111113; --panel: #161618; --hover: #1c1c1f; --line: #232327; --line2: #303036;
          --text: #ececef; --muted: #8e8e96; --faint: #5f5f67; --blue: #8b95ff; --rep: #4cc38a; --prop: #e8a94f;
          --del: #f07068; --obj: #b9a4ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 13px/1.5 'Pretendard', 'Noto Sans CJK KR', 'Malgun Gothic', system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .mono { font-family: 'JetBrains Mono', 'D2Coding', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .del { color: var(--del); } .rep { color: var(--rep); }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 7px;
                   padding: 5px 12px; cursor: pointer; font: inherit; font-weight: 500; }
  button:hover, select:hover { background: var(--hover); border-color: #3c3c43; }
  button:disabled { opacity: .45; cursor: default; }
  button[hidden] { display: none; }
  button.primary { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 600; }
  button.primary:hover { background: #fff; }
  button.danger { color: var(--del); border-color: rgba(240, 112, 104, .45); background: transparent; }
  button.danger:hover { background: rgba(240, 112, 104, .1); }
  button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
  button.quiet:hover { color: var(--text); background: var(--hover); }
  input[type=range] { accent-color: var(--blue); }
  kbd { font: 11px ui-monospace, Consolas, monospace; opacity: .55; margin-left: 6px; }
  /* top bar: which scene, and the transport */
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--side); border-bottom: 1px solid var(--line); }
  .ctl { display: flex; align-items: center; gap: 6px; }
  #title { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .chip { padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.prop { border-style: dashed; }
  .chip.muted { color: var(--muted); border-color: var(--line2); }
  .chip.obj { color: var(--obj); }
  #play { min-width: 86px; }
  #slider { flex: 1; min-width: 120px; }
  #time { color: var(--muted); min-width: 52px; text-align: right; }
  .tgl { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); cursor: pointer; }
  .tgl:has(input:checked) { color: var(--text); }
  .tgl input { accent-color: var(--blue); margin: 0; }
  #full, #home { color: var(--faint); font-size: 12px; text-decoration: none; white-space: nowrap; }
  #full:hover, #home:hover { color: var(--text); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
  /* left: the scope's progress, the filters, every scene */
  #list { overflow: auto; background: var(--side); border-right: 1px solid var(--line); padding: 12px 0 16px; }
  #sum { margin: 0 12px 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  #sum .scope { font-size: 15px; font-weight: 600; }
  #sum .scope span { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 6px; }
  #sum .line { display: flex; justify-content: space-between; gap: 6px; margin-top: 10px; color: var(--muted); }
  #sum .line b { color: var(--text); font-weight: 600; }
  #sum .line > span:first-child { white-space: nowrap; }
  #sum .line > span:last-child { text-align: right; }
  #sum .note { margin-top: 10px; color: var(--faint); font-size: 11.5px; line-height: 1.5; }
  body.app #home, body.app #full { display: none; }
  #newver { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; gap: 10px; align-items: center;
            padding: 8px 10px 8px 14px; background: #1c1c1f; border: 1px solid var(--rep); border-radius: 9px; font-size: 13px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
  #newver[hidden] { display: none; }
  #sum .bar { height: 4px; margin-top: 5px; border-radius: 2px; background: var(--line2); overflow: hidden; }
  #sum .bar i { display: block; height: 100%; background: var(--rep); }
  #sum .bar.ready i { background: var(--blue); }
  #sum .go { width: 100%; margin-top: 12px; padding: 8px 0; }
  #sum .go + .go { margin-top: 6px; }
  #sum select { padding: 0 4px; font-size: 12px; }
  .tabs { display: flex; gap: 2px; margin: 0 12px 4px; padding: 3px; background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; }
  .tabs { flex-wrap: wrap; }
  .tabs button { flex: 1 1 auto; padding: 5px 6px; border: none; background: transparent; color: var(--muted); font-size: 12px; border-radius: 7px; white-space: nowrap; }
  .tabs button:hover { color: var(--text); background: transparent; }
  .tabs button.on { background: var(--line2); color: var(--text); font-weight: 600; }
  .tabs button i { font-style: normal; color: var(--faint); margin-left: 4px; }
  #list .sec { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
  #list .row { display: flex; gap: 8px; align-items: center; min-height: 34px; padding: 0 12px 0 13px; cursor: pointer; border-left: 3px solid transparent; }
  #list .row:hover { background: var(--hover); }
  #list .row.prop { border-left-color: var(--prop); background: rgba(232, 169, 79, .05); }
  #list .row.drop { border-left-color: var(--del); background: rgba(240, 112, 104, .06); }
  #list .row.cur { background: #202027; border-left-color: var(--blue); }
  #list .row.cur.prop { border-left-color: var(--prop); background: #2a241b; }
  #list .row.cur.drop { border-left-color: var(--del); background: #2c1f1e; }
  #list .row b { font: 600 13px 'JetBrains Mono', 'D2Coding', ui-monospace, Consolas, monospace; }
  #list .row .kind { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .row.child { padding-left: 24px; }
  #list .row .br { color: var(--faint); font-family: ui-monospace, Consolas, monospace; }
  #list .row .gp { padding: 1px 8px; font-size: 11px; }
  .rd { width: 7px; height: 7px; border-radius: 50%; flex: none; border: 1px solid var(--faint); }
  .rd.part { background: conic-gradient(var(--blue) var(--p), transparent 0); border-color: var(--blue); }
  .rd.ok { background: var(--blue); border-color: var(--blue); }
  .ob { font: 11px ui-monospace, Consolas, monospace; color: var(--faint); white-space: nowrap; }
  .ob.low { color: var(--obj); }
  .st { font-size: 11px; font-weight: 600; white-space: nowrap; padding: 0 7px; line-height: 18px; border-radius: 999px; }
  .st.prop { color: var(--prop); box-shadow: inset 0 0 0 1px rgba(232, 169, 79, .6); }
  .st.drop { color: #1a0d0c; background: var(--del); }
  .st.keep { color: #0c1a12; background: var(--rep); }
  .st.rule { color: var(--rep); box-shadow: inset 0 0 0 1px rgba(76, 195, 138, .45); }
  .st.lock { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line2); }
  /* main view */
  #view { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px; min-height: 0; }
  /* decision card: the rule's verdict on this scene, why, and the person's decision */
  #banner { display: flex; align-items: center; gap: 24px; padding: 14px 16px 14px 18px; border-radius: 10px;
            background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--faint); }
  #banner.prop { border-left-color: var(--prop); }
  #banner.drop { border-left-color: var(--del); }
  #banner.keep { border-left-color: var(--rep); }
  #banner[hidden] { display: none; }
  #banner .why { flex: 1; min-width: 0; }
  #banner .verdict { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 15px; font-weight: 600; }
  #banner .lines { margin-top: 6px; color: var(--muted); }
  #banner .lines div { margin-top: 2px; }
  #banner .lines b { color: var(--text); font-weight: 600; }
  #banner .cmp { padding: 2px 10px; font-size: 12px; }
  #banner .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #banner .btns { display: flex; align-items: center; gap: 8px; }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; }
  .seg button { border: none; background: transparent; padding: 7px 16px; border-radius: 7px; color: var(--muted); font-weight: 600; }
  .seg button:hover { color: var(--text); background: var(--hover); }
  .seg button.keepb.on { background: var(--rep); color: #0c1a12; }
  .seg button.dropb.on { background: var(--del); color: #1a0d0c; }
  .seg button.on.auto { background: transparent; }
  .seg button.keepb.on.auto { color: var(--rep); box-shadow: inset 0 0 0 1px rgba(76, 195, 138, .6); }
  .seg button.dropb.on.auto { color: var(--del); box-shadow: inset 0 0 0 1px rgba(240, 112, 104, .6); }
  #dNext { padding: 8px 16px; }
  #banner .prog { color: var(--faint); font-size: 12px; }
  /* cameras, route, LiDAR */
  #grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  #left { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  #camBox { display: grid; gap: 8px; }
  #cams { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #cams figure { position: relative; margin: 0; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  #cams img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cams figcaption { position: absolute; left: 8px; top: 6px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 500;
                     line-height: 18px; background: rgba(0, 0, 0, .6); }
  svg.boxes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.boxes rect { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
  svg.boxes .veh { stroke: #6ea8ff; } svg.boxes .ped { stroke: #ffd24a; } svg.boxes .two { stroke: #f472b6; }
  svg.boxes .far { stroke-width: 1; opacity: .6; }
  svg.boxes .ex { stroke: #9aa3b2; stroke-dasharray: 6 4; }
  svg.boxes text { font: 600 36px 'Pretendard', system-ui, sans-serif; paint-order: stroke; stroke: rgba(0, 0, 0, .8); stroke-width: 8px; }
  #cams svg.boxes text { display: none; }
  #boxLeg { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--faint); font-size: 12px; }
  #boxLeg i { display: inline-block; width: 12px; height: 8px; border: 2px solid; border-radius: 2px; margin-right: 4px; }
  #boxLeg i.far { border-width: 1px; } #boxLeg i.ex { border-style: dashed; border-color: #9aa3b2; }
  #boxLeg b { color: var(--text); font-weight: 600; }
  .panel { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 0; }
  .panel .ph { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .panel .pf { padding: 0 12px 8px; }
  canvas { display: block; width: 100%; height: 100%; background: transparent; }
  #map { min-height: 100px; }
  #right { min-height: 0; }
  #lidar { cursor: grab; } #lidar:active { cursor: grabbing; }
  #stat, #lidarNote { color: var(--faint); font-size: 12px; font-weight: 400; }
  /* loading: playback waits for the cache instead of stuttering */
  .load { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; border-radius: 10px;
          background: rgba(12, 12, 14, .7); backdrop-filter: blur(2px); }
  .load[hidden] { display: none; }
  .load .box { width: 340px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; }
  .load .t { font-size: 15px; font-weight: 600; }
  .load .s { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .load .bar { height: 4px; margin-top: 12px; border-radius: 2px; background: var(--line2); overflow: hidden; }
  .load .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
  /* review: the kept scene and its deletion proposals side by side (opened from a stop duplicate's card) */
  #rev { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px;
         padding: 14px 16px; background: var(--bg); }
  #rev[hidden] { display: none; }
  #rev .bar { display: flex; align-items: center; gap: 10px; }
  #revTitle { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #revSlider { flex: 1; min-width: 80px; }
  #revReason { color: var(--muted); }
  #revTiles { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 12px; min-height: 0; }
  #revTiles figure { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-height: 0;
                     padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #revTiles figure.drop { border-color: rgba(240, 112, 104, .6); }
  #revTiles figure.keep { border-color: rgba(76, 195, 138, .5); }
  #revTiles figcaption { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #revTiles figcaption .sp { flex: 1; }
  #revTiles img { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 8px; min-height: 0; }
  #revTiles .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-height: 0; }
  #revTiles .body.both { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #revTiles .body canvas { height: 100%; min-height: 0; cursor: grab; }
  #revTiles .body.cam canvas, #revTiles .body.lid .camwrap { display: none; }
  #revTiles .camwrap { position: relative; min-height: 0; }
  #revTiles figure.revmap { grid-column: 1 / -1; }
  #revTiles figure.revmap .mapwrap { position: relative; min-height: 0; }
  #revTiles figure.revmap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 8px; background: #101013; }
  .dec { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; }
  .dec button { border: none; background: transparent; padding: 4px 14px; border-radius: 7px; color: var(--muted); font-weight: 600; }
  .dec button.on.keep { background: var(--rep); color: #0c1a12; }
  .dec button.on.drop { background: var(--del); color: #1a0d0c; }
  .dec button.on.auto { background: transparent; box-shadow: inset 0 0 0 1px currentColor; }
  .dec button.on.auto.keep { color: var(--rep); } .dec button.on.auto.drop { color: var(--del); }
  #revFoot { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; }
  #revFoot .sp { flex: 1; }
  #revDone { color: var(--rep); font-weight: 600; }
  /* 삭제 확정: plan first, then run */
  #apply { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 8, .78); }
  #apply[hidden] { display: none; }
  #apply .box { width: min(680px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 18px 20px;
                background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; }
  #apply h3 { margin: 0 0 12px; font-size: 17px; }
  #apply .row { margin: 8px 0; }
  #apply .warn { color: var(--prop); }
  #apply .names { margin-top: 3px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  #apply .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div class="ctl">
    <button id="prevScene" class="quiet" title="이전 씬 (↑)">↑</button><button id="nextScene" class="quiet" title="다음 씬 (↓)">↓</button>
    <span id="title">…</span><span class="chip" id="chip"></span><span class="chip obj" id="objChip" hidden></span>
  </div>
  <div class="ctl" style="flex: 1">
    <button id="play" title="재생 / 멈춤 (Space)">▶ 재생</button>
    <select id="speed" title="배속"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <input type="range" id="slider" min="0" max="39" value="0" title="key frame (← →)">
    <span id="time" class="mono">0.0 s</span>
  </div>
  <label id="boxLab" class="tgl" title="객체 수 규칙이 센 2D 박스. key frame에만 있어서 멈춰 있을 때 보입니다 (B)"><input type="checkbox" id="boxOn"> 2D 박스</label>
  <label id="autoLab" class="tgl" title="씬이 끝나면 목록의 다음 씬을 이어서 재생"><input type="checkbox" id="autoNext"> 이어서 재생</label>
  <a id="home" href="/" title="데이터 개요: route별 씬 수, 객체 수, 로직별 삭제 후보">개요</a>
  <a id="full" href="/full" title="이전의 자세한 뷰어 (분포, 위험, 라벨 등)">자세히 ↗</a>
</header>
<main>
  <nav id="list"></nav>
  <section id="view">
    <div id="banner" hidden>
      <div class="why"><div class="verdict"><span id="dChip" class="chip"></span><span id="dTitle"></span></div><div class="lines" id="dLines"></div></div>
      <div class="acts">
        <div class="btns">
          <div class="seg">
            <button id="dKeep" class="keepb" title="남기기로 확정합니다 (K) · 다시 누르면 후보로 돌아갑니다">남기기 확정<kbd>K</kbd></button>
            <button id="dDrop" class="dropb" title="버리기로 확정합니다 (D) · 확정한 씬만 앱의 최종 삭제에서 빠집니다 · 다시 누르면 후보로">버리기 확정<kbd>D</kbd></button>
          </div>
          <button id="dSkip" title="이 후보는 지금 확정하지 않고 넘깁니다 (S) · 건너뛴 후보는 나머지를 다 본 뒤 다시 나옵니다">건너뛰기<kbd>S</kbd></button>
          <button id="dNext" class="primary" title="아직 확정하지 않은 다음 후보로 (N)">다음 후보<kbd>N</kbd></button>
        </div>
        <span class="prog" id="dProg"></span>
      </div>
    </div>
    <div id="grid">
      <div id="left">
        <div id="camBox"><div id="cams"></div></div>
        <div class="panel"><div class="ph"><span>경로</span><span id="stat"></span></div><canvas id="map"></canvas><div class="pf"></div></div>
      </div>
      <div id="right" class="panel">
        <div class="ph"><span>LiDAR</span></div>
        <canvas id="lidar"></canvas>
        <div class="pf" id="lidarNote">드래그 = 회전 · 오른쪽 드래그 = 이동 · 휠 = 확대 · 더블클릭 = 처음 시점 · 원 10 m 간격 · 색 = 높이</div>
      </div>
      <div class="load" id="load" hidden><div class="box"><div class="t" id="loadT">불러오는 중</div><div class="s" id="loadS"></div><div class="bar"><i id="loadBar"></i></div></div></div>
    </div>
  </section>
</main>

<div id="newver" hidden><span>검토 화면이 업데이트됐습니다</span><button class="primary" onclick="location.reload()">새로고침</button></div>
<div id="rev" hidden>
  <div class="bar">
    <span id="revTitle"></span>
    <button id="revPrev" title="이전 그룹 (←)">◀ 이전</button><button id="revNext" title="다음 그룹 (→)">다음 ▶</button>
    <button id="revPlay" title="재생 / 멈춤 (Space)">▶ 재생</button>
    <select id="revSpeed" title="배속"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <input type="range" id="revSlider" min="0" max="20" step="0.1" value="0">
    <span id="revTime" class="mono">0.0 s</span>
    <select id="revCam" title="카메라"></select>
    <button id="revClose">닫기 (Esc)</button>
  </div>
  <div id="revReason" class="muted"></div>
  <div id="revTiles"></div>
  <div id="revFoot">
    <span>씬마다 <b>남기기 / 버리기</b>를 누르면 확정 (바로 저장, 다시 누르면 후보로) · 점선 = 아직 후보 · <b>A</b> 후보대로 확정하고 다음 · <b>S</b> 건너뛰기 · <b>← →</b> 이전/다음 그룹 · <b>Space</b> 재생</span>
    <span class="sp"></span><span id="revDone"></span>
    <button id="revSkip" title="이 그룹은 지금 확정하지 않고 다음 그룹으로 (S) · 건너뛴 그룹은 나머지를 다 본 뒤 다시 나옵니다">건너뛰기 →</button>
    <button id="revAccept" class="primary" title="아직 확정하지 않은 scene을 후보대로 확정하고 다음 그룹으로 (A)">후보대로 확정 → 다음</button>
  </div>
</div>

<div id="apply" hidden>
  <div class="box">
    <h3>삭제 확정</h3>
    <div id="applyBody"></div>
    <div class="acts"><button id="applyCancel">취소</button><button id="applyRun" class="danger">실행 (되돌리기 가능)</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAMS = ['CAM_FRONT_LEFT', 'CAM_FRONT', 'CAM_FRONT_RIGHT', 'CAM_BACK_LEFT', 'CAM_BACK', 'CAM_BACK_RIGHT'];
const CAM_KO = { CAM_FRONT_LEFT: '앞 왼쪽', CAM_FRONT: '앞', CAM_FRONT_RIGHT: '앞 오른쪽',
                 CAM_BACK_LEFT: '뒤 왼쪽', CAM_BACK: '뒤', CAM_BACK_RIGHT: '뒤 오른쪽' };
const short = n => n.slice(-4);
const routeOf = log => log.split('_')[0];

let scenes = [], byName = {}, sel = null, human = {}, order = [], cur = { si: -1, i: 0 }, req = 0;
const listed = () => scenes.filter(s => !s.extra);   // `extra`: out of ?logs=, loaded only as a candidate's kept scene
let groupOf = {}, bounds = null, lastEgo = null, listView = 'all', SEQ = [];   // SEQ: every listed scene, route order
try { listView = localStorage.getItem('simple.view') || 'all'; } catch (e) {}

// ---------- data ----------
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); }
const cache = new Map();
function cached(u) {   // small LRU for sample JSON
  if (cache.has(u)) { const p = cache.get(u); cache.delete(u); cache.set(u, p); return p; }
  const p = getJSON(u);
  cache.set(u, p);
  if (cache.size > 60) cache.delete(cache.keys().next().value);
  p.catch(() => cache.delete(u));
  return p;
}
const S = n => (sel && !sel.missing && sel.scenes && sel.scenes[n]) || {};
// ?logs=a,b: show only these logs' scenes (a course or a route, as the TCAR Parser GUI opens it); apply is scoped too
const ONLY = (new URLSearchParams(location.search).get('logs') || '').split(',').filter(Boolean);
if (new URLSearchParams(location.search).get('app')) document.body.classList.add('app');   // inside TCAR Parser: no links out
// ---------- fewest objects: the lowest share of scenes by near road users per sample (shown only, the rule decides nothing here) ----------
const OBJ = { share: 0.3, low: new Set(), sorted: [], rank: {}, cut: null };
try { OBJ.share = +localStorage.getItem('simple.objShare') || 0.3; } catch (e) {}
const objOf = n => { const o = S(n).objects_near; return o ? o.all.mean : null; };
function objRank() {
  OBJ.sorted = listed().map(s => s.name).filter(n => objOf(n) != null).sort((a, b) => objOf(a) - objOf(b) || (a < b ? -1 : 1));
  const k = Math.round(OBJ.sorted.length * OBJ.share);
  OBJ.low = new Set(OBJ.sorted.slice(0, k));
  OBJ.cut = k ? objOf(OBJ.sorted[k - 1]) : null;
  OBJ.rank = Object.fromEntries(OBJ.sorted.map((n, i) => [n, i + 1]));
}
const objBadge = n => objOf(n) == null ? '' : `<span class="ob${OBJ.low.has(n) ? ' low' : ''}" title="가까운 도로 이용자 샘플당 평균 `
  + `(카메라 6대 합) · 적은 순 ${OBJ.rank[n]} / ${OBJ.sorted.length}">${objOf(n).toFixed(1)}</span>`;
const diffOf = n => S(n).lidar_cells == null ? '?' : S(n).lidar_cells.toFixed(0);
const capOf = n => [S(n).lidar_cells != null ? `diff ${diffOf(n)}` : '',
                    S(n).objects_near ? `객체 ${S(n).objects_near.all.mean.toFixed(1)}` : ''].filter(Boolean).join(' · ');

// ---------- decisions: a scene a filter caught (객체 부족, 정지 중복) is a candidate (후보); the rest passed the filters
// (필터 통과). A person confirms (남기기 확정 / 버리기 확정).
// Confirmed decisions are saved at once (selection/human_decisions.json, keep.txt, drop.txt); the app's final deletion
// takes out only the confirmed 버리기 scenes. ----------
const ruleDrop = n => S(n).status === 'remove';
const humanOf = n => (human[n] && human[n].decision) || null;               // 'keep' | 'drop' | null
const lockedOf = n => !!S(n).locked;             // an earlier round's 최종 확정: stays for good, no decision here
const stateOf = n => lockedOf(n) ? 'locked' : humanOf(n) || (ruleDrop(n) ? 'cand' : 'pass');   // keep | drop | cand | pass | locked
const kindOf = n => S(n).kind || '기타';                                     // the filter that caught a candidate
const STEP = { '정지 중복': 1, '객체 부족': 2, '경로 겹침': 3 };                 // the filters' fixed order
const SKIP = new Set();                          // candidates passed over for now: they come back after the rest
try { JSON.parse(localStorage.getItem('simple.skip') || '[]').forEach(n => SKIP.add(n)); } catch (e) {}
const saveSkip = () => { try { localStorage.setItem('simple.skip', JSON.stringify([...SKIP])); } catch (e) {} };
const skipped = n => SKIP.has(n) && !humanOf(n);
const STATE_KO = { keep: '남기기 확정', drop: '버리기 확정', cand: '후보', pass: '필터 통과', locked: '잠김 · 이전 라운드 확정' };
const stateKo = n => stateOf(n) === 'cand' ? `후보 · ${kindOf(n)}` : STATE_KO[stateOf(n)];
const finalDrop = n => (humanOf(n) || (ruleDrop(n) ? 'drop' : 'keep')) === 'drop';
const childrenOf = p => Object.keys((sel && sel.scenes) || {}).filter(m => byName[m] !== undefined && ruleDrop(m) && S(m).substitute === p)
  .sort((a, b) => (S(b).lidar_cells || 0) - (S(a).lidar_cells || 0));
const isRuleRep = n => !ruleDrop(n) && childrenOf(n).length > 0;
let GROUPS = [];                                  // review items: [kept scene, ...its deletion proposals]
function buildGroups() {
  const parents = [];
  for (const s of listed()) {
    const n = s.name;
    if (ruleDrop(n)) {
      const sub = S(n).substitute, p = sub && byName[sub] !== undefined ? sub : n;   // its kept scene may be outside ?logs=
      if (!parents.includes(p)) parents.push(p);
    }
  }
  parents.sort((a, b) => order.indexOf(byName[a]) - order.indexOf(byName[b]));
  GROUPS = parents.map(p => ruleDrop(p) ? [p] : [p, ...childrenOf(p)]);
  const gStep = g => STEP[kindOf(g.length > 1 ? g[1] : g[0])] || 9;   // ① 정지 중복 → ② 객체 부족 → ③ 경로 겹침
  GROUPS.sort((a, b) => gStep(a) - gStep(b));                        // stable: list order inside a filter
}
function nextGroup(from) {   // the next group not settled, skipped ones last, after `from` first
  const open = GROUPS.map((g, k) => k).filter(k => k !== from && !groupDone(GROUPS[k]));
  const rank = k => GROUPS[k].some(skipped) ? 1 : 0, after = k => (k - from + GROUPS.length) % GROUPS.length;
  open.sort((a, b) => rank(a) - rank(b) || after(a) - after(b));
  return open.length ? open[0] : -1;
}
const groupDone = g => g.every(n => humanOf(n));
const groupBtn = gi => GROUPS[gi].length > 1   // 비교: the group side by side (confirmed or not: a choice can be changed there)
  ? `<button class="gp" data-review="${gi}" title="나란히 재생하며 비교 · 확정한 뒤에도 다시 보고 바꿀 수 있습니다">비교</button>`
  : `<button class="gp" data-review="${gi}" title="크게 재생하며 보기 · 확정한 뒤에도 바꿀 수 있습니다">보기</button>`;
const groupIndexOf = n => GROUPS.findIndex(g => g.includes(n));
function tag(n) {   // one short status per scene: the proposal until a person decides
  const h = humanOf(n);
  if (lockedOf(n)) return '<span class="st lock" title="이전 라운드에서 최종 확정 · 삭제되지 않음">잠김</span>';
  if (h === 'drop') return '<span class="st drop">버리기 확정</span>';
  if (h === 'keep') return `<span class="st keep">남기기 확정</span>`;
  if (ruleDrop(n)) return `<span class="st prop" title="후보: 이 필터에 걸림 · 아직 확정 전${skipped(n) ? ' · 건너뜀' : ''}">${esc(kindOf(n))}${skipped(n) ? ' · 건너뜀' : ''}</span>`;
  if (isRuleRep(n)) return `<span class="st rule" title="필터 통과: 같은 곳에 멈춘 씬 중 대표">대표</span>`;
  return '';
}
async function decide(n, v, via = 'manual') {   // v: 'keep' | 'drop' | null (back to the proposal); logged in decisions_log.txt
  if (lockedOf(n)) { alertLine(`${short(n)}: 이전 라운드에서 최종 확정된 씬이라 바꿀 수 없습니다`); return; }
  const r = await fetch('/api/decisions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ scene: n, decision: v, via }) });
  if (!r.ok) { alertLine('저장 실패: HTTP ' + r.status); return; }
  human = (await r.json()).decisions || {};
  if (v && SKIP.delete(n)) saveSkip();
  refreshStatus();
}
function alertLine(t) { $('revDone').textContent = t; $('stat').textContent = t; }
function refreshStatus() {
  buildList();
  if (cur.si >= 0) { header(scenes[cur.si]); banner(scenes[cur.si]); }
  if (!$('rev').hidden) renderReviewState();
}

// ---------- left: summary + list ----------
const pct = (a, b) => a ? `−${((1 - b / a) * 100).toFixed(1)}%` : '';
const gb = v => (v / 1e9).toFixed(1) + ' GB';
const sumBytes = ns => ns.reduce((a, n) => a + (S(n).bytes || 0), 0);
let READY = {};
function buildList() {
  const logs = [], routeOrder = sel && sel.routes ? sel.routes.map(r => r.log) : [];
  for (const s of listed()) if (!logs.includes(s.log)) logs.push(s.log);
  logs.sort((a, b) => (routeOrder.indexOf(a) + 1 || 99) - (routeOrder.indexOf(b) + 1 || 99));
  SEQ = logs.flatMap(lg => scenes.map((s, i) => i).filter(i => scenes[i].log === lg && !scenes[i].extra));   // whatever tab
  const all = listed().map(s => s.name);
  const props = all.filter(ruleDrop), open = props.filter(n => !humanOf(n));
  const cKeep = all.filter(n => humanOf(n) === 'keep').length, cDrop = all.filter(n => humanOf(n) === 'drop').length;
  const nPass = all.filter(n => stateOf(n) === 'pass').length;
  const ready = all.filter(n => (READY[n] || 0) >= 0.999).length;
  const scope = ONLY.length ? [...new Set(ONLY.map(routeOf))].join(', ') : '전체';
  const on = v => listView === v ? ' class="on"' : '';
  let html = `<div id="sum"><div class="scope">${esc(scope)}<span>씬 ${all.length}개</span></div>`
    + `<div class="line"><span>후보 확정</span><span><b>${props.length - open.length}</b> / ${props.length}</span></div>`
    + `<div class="bar"><i style="width:${props.length ? (props.length - open.length) / props.length * 100 : 100}%"></i></div>`
    + `<div class="line"><span>후보</span><span>${Object.entries(props.reduce((a, n) => (a[kindOf(n)] = (a[kindOf(n)] || 0) + 1, a), {}))
          .sort((a, b) => (STEP[a[0]] || 9) - (STEP[b[0]] || 9)).map(([k, v]) => `${esc(k)} <b>${v}</b>`).join(' · ') || '없음'}</span></div>`
    + `<div class="line"><span>확정</span><span>남기기 <b>${cKeep}</b> · 버리기 <b>${cDrop}</b> · 필터 통과 <b>${nPass}</b></span></div>`
    + `<div class="line" title="재생용 사본이 로컬 디스크에 다 있는 씬. 씬을 열면 그 씬부터 목록 순서대로 준비합니다"><span>재생 준비</span><span><b>${ready}</b> / ${all.length}</span></div>`
    + `<div class="bar ready"><i style="width:${all.length ? ready / all.length * 100 : 0}%"></i></div>`
    + (open.some(skipped) ? `<div class="line"><span>건너뜀</span><span><b>${open.filter(skipped).length}</b>개 · 나머지 뒤에 다시</span></div>` : '')
    + (open.length ? `<button class="go primary" data-next="1">다음 후보 · ${open.length}개 남음</button>` : '')
    + `<div class="note">필터(① 정지 중복 → ② 객체 부족 → ③ 경로 겹침, 앞에서 걸린 씬은 뒤에서 안 봄)에 걸린 씬이 후보입니다. 남기기 / 버리기를 누르면 확정되고 바로 저장됩니다. 버리기 확정 씬은 앱의 큐레이션 화면에서 최종 삭제합니다.</div>`
    + `</div><div class="tabs"><button data-view="all"${on('all')}>전체<i>${all.length}</i></button>`
    + `<button data-view="del"${on('del')} title="필터에 걸렸고 아직 확정하지 않은 씬 (확정하면 여기서 빠집니다)">후보<i>${open.length}</i></button>`
    + `<button data-view="dec"${on('dec')} title="사람이 확정한 씬">확정<i>${cKeep + cDrop}</i></button>`
    + `<button data-view="pass"${on('pass')} title="어느 필터에도 걸리지 않은 씬 (남기기로 확정된 것으로 봄)">필터 통과<i>${nPass}</i></button>`
    + (OBJ.sorted.length ? `<button data-view="obj"${on('obj')} title="가까운 도로 이용자가 적은 하위 ${Math.round(OBJ.share * 100)}%">객체 적음<i>${OBJ.low.size}</i></button>` : '')
    + `</div>`;
  order = [];
  const row = (i, extra = '', br = '', route = false) => {
    const n = scenes[i].name, kind = (S(n).group_label || '').split(' · ').pop();
    order.push(i);
    const st = stateOf(n), mark = st === 'drop' ? ' drop' : st === 'cand' ? ' prop' : '';    // 버리기 확정 / 후보 stand out
    const f = READY[n] || 0, rd = f >= 0.999 ? ' ok' : f > 0 ? ' part' : '';
    return `<div class="row${br ? ' child' : ''}${mark}${i === cur.si ? ' cur' : ''}" data-i="${i}">${br ? `<span class="br">${br}</span>` : ''}`
      + `<span class="rd${rd}" style="--p:${Math.round(f * 100)}%" title="재생 준비 ${Math.round(f * 100)}%"></span><b>${short(n)}</b><span class="kind">${route ? routeOf(scenes[i].log) + ' · ' : ''}${kind}</span>${objBadge(n)}${tag(n)}${extra}</div>`;
  };
  if (listView === 'dec') {   // what people confirmed, in route order; a group whole, with 비교, so it can be looked at again
    const dec = SEQ.filter(i => humanOf(scenes[i].name)), seen = new Set();   //   and changed (press the other choice)
    html += `<div class="sec"><span>사람이 확정한 씬 · 다시 비교하고 바꿀 수 있음</span><span>남기기 ${cKeep} · 버리기 ${cDrop}</span></div>`;
    for (const i of dec) {
      const n = scenes[i].name, gi = groupIndexOf(n);
      if (seen.has(n)) continue;
      const g = gi >= 0 ? GROUPS[gi] : [n];
      g.forEach(m => seen.add(m));
      html += row(byName[g[0]], gi >= 0 ? groupBtn(gi) : '', '', true);
      g.slice(1).forEach((c, k) => { html += row(byName[c], '', k === g.length - 2 ? '└' : '├', true); });
    }
    if (!dec.length) html += '<div class="sec"><span>아직 확정한 씬이 없습니다</span></div>';
    $('list').innerHTML = html;
    return;
  }
  if (listView === 'obj' && OBJ.sorted.length) {           // flat, fewest first
    html += `<div class="sec"><span>가까운 도로 이용자가 적은 순</span><span>하위 ${Math.round(OBJ.share * 100)}% · ${OBJ.low.size}개</span></div>`;
    for (const n of OBJ.sorted) if (OBJ.low.has(n)) html += row(byName[n], '', '', true);
    $('list').innerHTML = html;
    return;
  }
  for (const lg of logs) {
    const idx = scenes.map((s, i) => i).filter(i => scenes[i].log === lg && !scenes[i].extra);
    const names = idx.map(i => scenes[i].name), nd = names.filter(n => humanOf(n) === 'drop').length;
    const nc = names.filter(n => stateOf(n) === 'cand').length;
    if (listView === 'del' && !nc) continue;          // 후보: only what is still to be confirmed
    if (listView === 'pass') {                        // 필터 통과: flat per route
      const ps = idx.filter(i => stateOf(scenes[i].name) === 'pass');
      if (!ps.length) continue;
      html += `<div class="sec"><span>${routeOf(lg)} · 필터 통과 ${ps.length} / ${idx.length}</span></div>`;
      for (const i of ps) html += row(i, '<span class="st rule" title="어느 필터에도 걸리지 않음 · 남기기로 확정된 것으로 봄">필터 통과</span>');
      continue;
    }
    html += `<div class="sec"><span>${routeOf(lg)} · ${idx.length}개</span><span>`
      + [nc ? `후보 ${nc}` : '', nd ? `<span class="del">버리기 확정 ${nd}</span>` : ''].filter(Boolean).join(' · ') + '</span></div>';
    for (const i of idx) {
      const n = scenes[i].name, kids = childrenOf(n).filter(c => scenes[byName[c]].log === lg);   // other routes' list them
      if (ruleDrop(n) && byName[S(n).substitute] !== undefined && scenes[byName[S(n).substitute]].log === lg) continue;   // under its kept scene
      const shown = listView === 'del' ? kids.filter(c => stateOf(c) === 'cand') : kids;   // 후보: confirmed ones drop out
      if (listView === 'del' && !shown.length && stateOf(n) !== 'cand') continue;          // (a kept scene stays while its
      const gi = groupIndexOf(n);                                                           //  group has open candidates)
      html += row(i, gi >= 0 ? groupBtn(gi) : '');
      shown.forEach((c, k) => { html += row(byName[c], '', k === shown.length - 1 ? '└' : '├'); });
    }
  }
  if (listView === 'del' && !open.length)
    html += `<div class="sec"><span>확정할 후보가 없습니다 · 필터에 걸린 ${props.length}개를 모두 확정했습니다 (확정 탭)</span></div>`;
  $('list').innerHTML = html;
}
$('list').onchange = e => {
  if (e.target.id !== 'objShare') return;
  OBJ.share = +e.target.value;
  try { localStorage.setItem('simple.objShare', OBJ.share); } catch (err) {}
  objRank(); buildList();
  if (cur.si >= 0) header(scenes[cur.si]);
};
$('list').onclick = e => {
  if (e.target.closest('select')) return;
  const v = e.target.closest('[data-view]');
  if (v) { listView = v.dataset.view; try { localStorage.setItem('simple.view', listView); } catch (err) {} return buildList(); }
  if (e.target.closest('[data-next]')) return goNextProposal();
  const g = e.target.closest('[data-review]');
  if (g) return openReview(+g.dataset.review);
  const r = e.target.closest('.row');
  if (r) go(+r.dataset.i, 0);
};

// ---------- header + reason line ----------
function header(sc) {
  $('title').textContent = `${sc.name} · ${routeOf(sc.log)}`;
  const n = sc.name, h = humanOf(n), chip = $('chip');
  chip.textContent = stateKo(n);
  chip.className = 'chip ' + (h === 'drop' ? 'del' : h === 'keep' ? 'rep' : ruleDrop(n) ? 'del prop' : 'rep prop');
  const oc = $('objChip');
  oc.hidden = !OBJ.low.has(n);
  oc.textContent = OBJ.low.has(n) ? `객체 적음 · 샘플당 ${objOf(n).toFixed(1)} · 적은 순 ${OBJ.rank[n]} / ${OBJ.sorted.length}` : '';
  oc.title = `가까운 도로 이용자 샘플당 평균이 하위 ${Math.round(OBJ.share * 100)}%인 scene`;
  document.querySelectorAll('#list .row').forEach(r => r.classList.toggle('cur', +r.dataset.i === cur.si));
  const row = document.querySelector('#list .row.cur');
  if (row) row.scrollIntoView({ block: 'nearest' });
}
function ruleText(g) {   // why the rule proposes what it proposes, for one review group
  const p = g[0], grp = groupOf[p] || g;
  if (g.length === 1) return `후보 · ${S(p).summary || ''}`

  const rule = p.deleted.filter(n => p.by[n] !== 'human'), ren = Object.entries(p.rename);
  $('applyBody').innerHTML =
    `<div class="row"><b>scene ${p.n_before} → ${p.n_after}</b> · ${p.deleted.length}개를 데이터에서 뺍니다 (${(p.bytes_moved / 1e9).toFixed(1)} GB)</div>`
    + `<div class="row">빼는 scene: ${p.deleted.map(n => `<b class="mono">${short(n)}</b> ${p.by[n] === 'human'
        ? '<span class="muted">(사람 결정)</span>' : '<span class="del">(규칙 제안)</span>'}`).join(' · ')}</div>`
    + (rule.length ? `<div class="row warn">⚠ 아직 사람이 보지 않은 규칙 제안 ${rule.length}개(${rule.map(short).join(', ')})도 그대로 빠집니다. 먼저 검토하는 것을 권장합니다.</div>` : '')
    + `<div class="row">이름 당김 ${ren.length}개 (빈 번호 없이 앞으로 채움)<div class="names">${ren.map(([a, b]) => `${short(a)}→${short(b)}`).join('  ') || '없음'}</div></div>`
    + `<div class="row muted">지우지 않고 <span class="mono">_removed/&lt;시각&gt;/</span> 폴더로 옮기고, 원래 표와 이름 대응표를 같이 저장해 되돌릴 수 있습니다. `
    + `남는 scene에 대한 결정(예: 남기기)은 새 이름으로 따라가고, 규칙은 새 데이터로 다시 돌립니다. 모든 결정은 decisions_log.txt에 남습니다.</div>`;
  $('applyRun').disabled = false;
}
async function runApply() {
  $('applyRun').disabled = true; $('applyCancel').disabled = true;
  $('applyBody').textContent = '적용 중… (파일 이동 · 이름 변경 · 규칙 다시 실행)';
  let r;
  try {
    const res = await fetch('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true, logs: ONLY.length ? ONLY : null }) });
    r = res.ok ? await res.json() : { ok: false, error: 'HTTP ' + res.status };
  } catch (e) { r = { ok: false, error: e.message }; }
  $('applyCancel').disabled = false;
  if (!r.ok) {
    $('applyBody').innerHTML = `<div class="row warn">실패: ${esc(r.error || '')}</div><div class="row muted">${esc(r.hint || '')}</div>`;
    return;
  }
  $('applyBody').innerHTML = `<div class="row"><b>완료</b> · 이제 scene ${r.n_after}개 · ${r.deleted.length}개를 백업으로 옮김</div>`
    + `<div class="row muted">백업: <span class="mono">${esc(r.backup)}</span></div>`
    + `<div class="row muted">되돌리기: <span class="mono">${esc(r.undo)}</span></div>`
    + (r.curate_ok ? '' : '<div class="row warn">규칙 재실행 실패 — python curate.py 를 직접 실행하세요</div>');
  $('applyRun').hidden = true;
  $('applyCancel').textContent = '새로고침';
  $('applyCancel').onclick = () => { history.replaceState(null, '', '/review' + location.search); location.reload(); };
}
$('applyRun').onclick = runApply;

// ---------- keys ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (!$('apply').hidden) { if (e.key === 'Escape' && !$('applyCancel').disabled) $('applyCancel').click(); return; }
  if (!$('rev').hidden) {
    if (e.key === 'Escape') closeReview();
    else if (e.key === ' ') { e.preventDefault(); revToggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); openReview(REV.gi + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); openReview(REV.gi - 1); }
    else if (e.key === 'a' || e.key === 'A') acceptRule();
    else if (e.key === 's' || e.key === 'S') revSkip();
    else if (e.key === 'b' || e.key === 'B') { $('boxOn').checked = !$('boxOn').checked; $('boxOn').onchange(); }
    return;
  }
  if (e.target === $('slider') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;   // the slider moves itself
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur.si, cur.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur.si, cur.i - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); stepScene(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); stepScene(-1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'b' || e.key === 'B') { $('boxOn').checked = !$('boxOn').checked; $('boxOn').onchange(); }
  else if (e.key === 'k' || e.key === 'K') decideHere('keep');
  else if (e.key === 'd' || e.key === 'D') decideHere('drop');
  else if (e.key === 'n' || e.key === 'N') goNextProposal();
  else if (e.key === 's' || e.key === 'S') skipHere();
});
let resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { drawMap(); drawRevMap(); lschedule(); }, 100);
});

// ---------- start ----------
let readyBusy = false;
async function pollReady() {
  const names = scenes.map(s => s.name).filter(n => (READY[n] || 0) < 0.999);
  if (!names.length || readyBusy) return;
  readyBusy = true;
  try {
    const got = await fetch('/api/ready?scenes=' + encodeURIComponent(names.join(','))).then(r => r.json());
    const moved = Object.entries(got).some(([n, f]) => Math.abs((READY[n] || 0) - f) >= 0.02 || (f >= 0.999) !== ((READY[n] || 0) >= 0.999));
    Object.assign(READY, got);
    if (moved) buildList();
  } catch (e) {} finally { readyBusy = false; }
}
setInterval(pollReady, 3000);
let PAGE_MTIME = null;                           // the page's code changed on the server: offer a reload (decisions are saved)
setInterval(async () => {
  try {
    const m = (await getJSON('/api/page')).mtime;
    if (PAGE_MTIME === null) PAGE_MTIME = m; else if (m !== PAGE_MTIME) $('newver').hidden = false;
  } catch (e) {}
}, 15000);
async function init() {
  const [sc, se, hd] = await Promise.all([getJSON('/api/scenes'), getJSON('/api/selection').catch(() => ({ missing: true })),
                                          getJSON('/api/decisions').catch(() => ({ decisions: {} }))]);
  sel = se;
  scenes = ONLY.length ? sc.scenes.filter(s => ONLY.includes(s.log)) : sc.scenes;
  if (ONLY.length && sel && !sel.missing) {       // a candidate here whose kept scene is in another route or course (path
    const want = new Set(scenes.map(s => S(s.name).substitute).filter(Boolean));   // overlap crosses them): load that
    for (const s of sc.scenes) if (want.has(s.name) && !ONLY.includes(s.log)) scenes.push(Object.assign(s, { extra: true }));
  }                                               // scene too, for the comparison and its map (not listed, not counted)
  scenes.forEach((s, i) => { byName[s.name] = i; });
  human = hd.decisions || {};
  if (sel && !sel.missing) for (const r of sel.routes || []) for (const g of r.stage1_groups || []) for (const m of g) groupOf[m] = g;
  objRank();
  const h = new URLSearchParams(location.hash.slice(1));
  if (['del', 'all', 'obj', 'dec', 'pass'].includes(h.get('view'))) listView = h.get('view');
  const saveView = listView;
  listView = 'all'; buildList();                   // scene order for the review groups
  buildGroups();
  listView = saveView; buildList();
  pollReady();
  let si = byName[h.get('scene')] ?? order[0];
  if (h.get('next') !== null) { const j = nextProposal(order[order.length - 1]); if (j >= 0) si = j; }
  await go(si, +h.get('i') || 0);
  if (h.get('play')) startPlay();
  const ri = h.get('review');                      // review=next: the first group not decided yet (the GUI opens this)
  if (ri !== null && ri !== undefined && GROUPS.length) {
    const gi = ri === 'next' ? Math.max(0, GROUPS.findIndex(g => !groupDone(g))) : +ri || 0;
    openReview(gi, +h.get('t') || 0, h.get('pause') === null);
  }
}
init().catch(e => { $('title').textContent = '초기화 실패: ' + e.message; });
</script>
